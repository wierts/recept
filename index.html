<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepten – Selecteer</title>
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recepten">
<link rel="stylesheet" href="theme.css">
<style>
  :root {
    --bg: #0b1220;
    --card: #111827;
    --ink: #e5e7eb;
    --muted: #9ca3af;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --border: #1f2937;
    --border-hover: #374151;
    --card-hover: rgba(255,255,255,0.06);
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) { --border-hover: #cbd0d8; --card-hover: rgba(0,0,0,0.03); --shadow: 0 4px 24px rgba(0,0,0,0.08); }
  }
  :root[data-theme="light"] {
    --border-hover: #cbd0d8;
    --card-hover: rgba(0,0,0,0.03);
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--card) 100%);
    color: var(--ink);
    line-height: 1.5;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 8px 0;
    background: linear-gradient(135deg, var(--ink) 0%, var(--muted) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: linear-gradient(180deg, rgba(127,127,127,0.07) 0%, rgba(127,127,127,0.03) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--border-hover);
    background: var(--card-hover);
  }

  .card h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
    min-height: 60px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
  }

  .btn {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    border-color: var(--accent);
    color: #ffffff;
    background: var(--accent);
  }

  .btn:first-of-type {
    border-color: var(--accent);
  }

  .btn:first-of-type:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .card-meta {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.78rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(127,127,127,0.08);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .badge.easy { border-color: #22c55e44; color: #22c55e; }
  .badge.medium { border-color: #f59e0b44; color: #f59e0b; }
  .badge.hard { border-color: #ef444444; color: #ef4444; }

  @media (max-width: 600px) {
    .wrap { padding: 24px 16px 40px; }
    header h1 { font-size: 1.6rem; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 768px) {
    .wrap { max-width: 1000px; padding: 56px 32px 80px; }
    header h1 { font-size: 2.3rem; }
    .subtitle { font-size: 1.05rem; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .card { padding: 24px; }
    .card h2 { font-size: 1.25rem; }
    .btn { font-size: 1rem; padding: 14px 18px; }
  }
</style>
</head>
<body data-page="index">
<noscript><div style="padding:20px;color:#e5e7eb;background:#1f2937;margin:16px;border-radius:10px;">JavaScript is uitgeschakeld. Zet JavaScript aan om deze pagina te gebruiken.</div></noscript>
  <div class="wrap">
    <div class="page-controls" style="justify-content:flex-end;margin-bottom:-6px">
      <div class="control-buttons">
        <button id="themeToggle" class="icon-btn" title="Licht/donker thema" type="button">🌓</button>
      </div>
    </div>
    <header>
      <h1>Recepten Selectie</h1>
      <p class="subtitle">Selecteer een recept om te bekijken</p>
      <p class="subtitle" style="margin-top:6px;"><button type="button" id="verBtn" class="ver-btn" hidden></button></p>
    </header>
    <div class="search-wrap">
      <input type="search" id="searchInput" class="search-input" placeholder="Zoek op naam, keuken of bron…" aria-label="Zoek recept">
    </div>
    <div class="filters" id="filters"></div>
    <section class="grid" id="recipeGrid"></section>
    <p class="search-empty" id="searchEmpty" hidden>Geen recepten gevonden.</p>
  </div>
  <dialog id="versionDialog" class="ver-dialog" aria-labelledby="versionTitle">
    <div class="ver-dialog-head">
      <h2 id="versionTitle">Wijzigingsoverzicht</h2>
      <button type="button" class="icon-btn" id="versionClose" aria-label="Sluiten">✕</button>
    </div>
    <ol class="ver-list" id="versionList"></ol>
  </dialog>
<script src="recipes-data.js"></script>
<script src="recipe.js" defer></script>
<script src="theme.js" defer></script>
</body>
</html>
